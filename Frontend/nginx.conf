events {}

http {
  server {
    listen 80;

    root /usr/share/nginx/html;  # Ensure this points to your built frontend

    # Serve static files directly if they exist
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Add MIME types for JS, CSS, and other assets
    include /etc/nginx/mime.types;

    # Specify MIME type for JavaScript and CSS explicitly
    location ~* \.(?:js|css|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|eot|otf|json|xml)$ {
      add_header Content-Type $content_type;
      try_files $uri =404;
    }

    # Optional: Handle favicon requests
    location = /favicon.ico {
      try_files /favicon.ico =204;
    }
  }
}
